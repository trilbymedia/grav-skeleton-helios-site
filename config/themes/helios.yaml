# Search
search:
  provider: yetisearch-pro

# Enable versioning for demo
versioning:
  enabled: true
  mode: explicit
  auto_detect: true
  default_version: v3
  labels:
    v1: "v1 (Legacy)"
    v2: "v2 (Stable)"
    v3: "v3 (Latest)"

# Header menu
header:
  menu:
    # The sample course: only shown on a site running KahunaCart and
    # Subscriptions (the course page asks for them with requires_plugins).
    - route: /writing-docs
      label: Course
    - route: /privacy
      label: Privacy
    - route: /contact
      label: Contact
    - route: /copyright
      label: Copyright

# Courses: Join buttons on the sample course go to the membership page
courses:
  membership_route: /membership
